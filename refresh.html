<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refresh App</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6f9;color:#12202e;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}.card{max-width:480px;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(11,31,51,.12);text-align:center}h1{font-size:22px}p{color:#6d7b88;line-height:1.5}.ok{color:#14804a;font-weight:800}</style></head><body><div class="card"><h1>Refreshing Electrical Store App…</h1><p id="msg">Removing only the old offline cache. Your inventory, photos and records are not being deleted.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k))}document.getElementById('msg').innerHTML='<span class="ok">Old cache cleared.</span><br>Opening the latest version…';setTimeout(()=>location.replace('./?fresh=v24-'+Date.now()),700)}catch(e){document.getElementById('msg').textContent='Could not clear cache automatically. Please reload Safari and try again.'}})();</script></body></html>
